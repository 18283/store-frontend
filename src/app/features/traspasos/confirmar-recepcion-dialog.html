<form [formGroup]="form">
  <div mat-dialog-content class="dialog-content">

    <!-- Mostrar datos de la solicitud (solo lectura) -->
    <div class="solicitud-datos">
      <mat-form-field appearance="outline" class="form-field-sin-borde">
        <mat-label>Código</mat-label>
        <input matInput type="text" [value]="solicitud?.codigo" readonly>
      </mat-form-field>

      <mat-form-field appearance="outline" class="form-field-sin-borde">
        <mat-label>Variante</mat-label>
        <input matInput type="text" [value]="solicitud?.variante" readonly>
      </mat-form-field>

      <mat-form-field appearance="outline" class="form-field-sin-borde">
        <mat-label>Origen</mat-label>
        <input matInput type="text" [value]="solicitud?.origen" readonly>
      </mat-form-field>

      <mat-form-field appearance="outline" class="form-field-sin-borde">
        <mat-label>Destino</mat-label>
        <input matInput type="text" [value]="solicitud?.destino" readonly>
      </mat-form-field>

      <mat-form-field appearance="outline" class="form-field-sin-borde">
        <mat-label>Cantidad Solicitada</mat-label>
        <input matInput type="number" [value]="solicitud?.cantidad" readonly>
      </mat-form-field>
    </div>

    <!-- Formulario para la cantidad a recibir -->
    <div class="formulario-recibir">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Cantidad a recibir</mat-label>
        <input matInput type="number" formControlName="cantidadRecibida" readonly>
      </mat-form-field>
    </div>

    <!-- Observaciones (opcional) -->
    <mat-form-field appearance="outline" class="full-width" style="margin-top: 16px;">
      <mat-label>Observaciones</mat-label>
      <textarea matInput formControlName="observaciones" rows="3"></textarea>
    </mat-form-field>
  </div>

  <!-- Acciones del diálogo -->
  <div mat-dialog-actions class="acciones-dialogo">
    <button mat-button type="button" (click)="onCancelar()">Cancelar</button>
    <button mat-button color="primary" type="button" (click)="onConfirmar()">Confirmar</button>
  </div>
</form>
